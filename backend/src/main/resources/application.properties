spring.application.name=fuelytics-backend
app.google.client-id=${GOOGLE_CLIENT_ID:}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origin=${FRONTEND_URL}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth-rate-limit.login-max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:10}
app.auth-rate-limit.register-max-attempts=${AUTH_REGISTER_MAX_ATTEMPTS:5}
app.auth-rate-limit.window-ms=${AUTH_RATE_LIMIT_WINDOW_MS:60000}
app.gas-stations.source-url=https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/
app.gas-stations.refresh-ms=1800000
app.gas-stations.allow-sample-fallback=false

# SMTP directo: no se utilizan APIs HTTP para enviar correo.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Fuelytics}
app.mail.frontend-url=${MAIL_FRONTEND_URL:${FRONTEND_URL}}
spring.mail.host=${MAIL_HOST:smtp.mail.me.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
management.health.mail.enabled=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
